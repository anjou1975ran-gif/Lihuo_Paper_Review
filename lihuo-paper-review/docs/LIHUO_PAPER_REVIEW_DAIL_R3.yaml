version: "2.0-EXP-LIHUO"
meta:
  runtime_id: "LIHUO_PAPER_REVIEW_V3_EXP_QS_R3"
  vertical_domain: "ACADEMIC_PAPER_REVIEW"
  paper_review_version: "V3.0-EXP-QS-R3"
  protocol: "LIHUO PROTOCOL V2.3"
  lighter: "LIHUO LIGHTER V3.5-EXP"
  main_system: "LIHUO AI SYSTEM V3.5-EXP"

world:
  entities: [PAPER, CLAIM, METHOD, EVIDENCE, SOURCE, AUTHOR_POSITION, REVIEW_REPORT]
  facts: []
  evidence: []
  unknowns: []

direction:
  goals:
    - RECONSTRUCT_CLAIM_EVIDENCE_CHAIN
    - AUDIT_PREMISE_AND_METHOD_AUTHORITY
    - FIND_MINIMUM_AUTHORIZED_CLAIM
  preserve_alternatives:
    - COMPETING_INTERPRETATIONS
    - ORTHOGONAL_QUALIFICATIONS
    - UNRESOLVED_SUPERPOSITION

boundary:
  must_preserve:
    - SOURCE_AUTHORITY
    - FACT_EVIDENCE_UNKNOWN_SEPARATION
    - POSITION_PROVENANCE
    - INDIVIDUAL_CLAIM_DIFFERENCES
    - UNRESOLVED_STATE
    - HOLD_AND_PARTIAL_STATE
  prohibited:
    - AI_AUTHORSHIP_JUDGMENT
    - AUTHOR_MOTIVE_JUDGMENT
    - FINAL_ACADEMIC_SOVEREIGNTY
    - FABRICATE_MISSING_EVIDENCE
    - FABRICATE_ORDINARY_AI_REVIEW
    - WEBSITE_FIELD_TO_WORLD_WRITEBACK
  failure_conditions:
    - CLAIM_EXCEEDS_EVIDENCE
    - SOURCE_SCOPE_DRIFT
    - UNKNOWN_PROMOTED_TO_FACT

responsibility:
  interpretation_owner: LIHUO_PAPER_REVIEW_VERTICAL
  decision_owner: HUMAN_OR_AUTHORIZED_ACADEMIC_INSTITUTION
  execution_owner: LIHUO_PAPER_REVIEW_VERTICAL_AND_BOUND_PROVIDERS
  verification_owner: LIHUO_LIGHTER_AND_EXPLICIT_REVIEW_VALIDATION
  return_to: LIHUO_LIGHTER_FINAL_CLASSICALIZATION_GATE

capability_requirement:
  required:
    - SOURCE_SCOPE_LOCK
    - PAPER_STRUCTURE_RECONSTRUCTION
    - PREMISE_AUTHORIZATION_AUDIT
    - EVIDENCE_AUDIT
    - CLAIM_AUTHORITY_DOWNGRADE
    - MULTI_AXIS_QUALIFICATION
    - POSITION_PROVENANCE_TRACKING
    - UNCERTAINTY_PRESERVATION
    - LIGHT_TRACE_OBSERVATION
    - AUTHORITY_GRAVITY_AUDIT
    - ANTI_FLATTERY_OUTPUT_ORDER
  optional:
    - MULTI_PATH_RECOMPETITION
    - COUNTER_PATH_REENTRY
    - R_CCC_QS_RECOMPOSITION
    - ENDLESS_RESCAN
    - SAC_DEPENDENT_SCOPED_REACTIVATION
    - MEDICAL_EVIDENCE_PROFILE
    - WEB_CASE_EXPORT_PROJECTION

provider_resolution:
  sac_independent:
    provider: LIHUO_LIGHTER_OR_PAPER_REVIEW_VERTICAL
  medical:
    capability: MEDICAL_EVIDENCE_PROFILE
    provider: "LIHUO MedReview Agent v0.2"
  sac_dependent:
    provider: "LIHUO AI SYSTEM V3.5-EXP"
    capabilities:
      - MULTI_PATH_RECOMPETITION
      - COUNTER_PATH_REENTRY
      - R_CCC_QS_RECOMPOSITION
      - ENDLESS_RESCAN
      - SAC_DEPENDENT_SCOPED_REACTIVATION

wiring:
  first_touch_owner: REVIEW_INTAKE_SOURCE_SCOPE_LOCK
  ordering:
    - SOURCE_SCOPE_LOCK
    - FACT_EVIDENCE_UNKNOWN_TYPING
    - Q0_FRAME_AUDIT
    - PREMISE_AND_METHOD_AUDIT
    - EVIDENCE_BOUNDARY_AND_CLAIM_DOWNGRADE
    - MULTI_AXIS_QUALIFICATION
    - OPTIONAL_BOUND_SAC_DEPENDENT_PROVIDER
    - REPORT_ASSEMBLY
    - FINAL_CLASSICALIZATION
    - OPTIONAL_WEB_CASE_EXPORT
  main_system_return_to: LIHUO_LIGHTER_V3_5_PAPER_REVIEW_REPORT_ASSEMBLER
  web_export_after_final_gate: true

validation:
  checks:
    - UNKNOWN_PRESERVED
    - FACT_EVIDENCE_SEPARATED
    - DIRECTION_NOT_AUTHORIZATION
    - CAPABILITY_NOT_PROVIDER
    - MANIFESTATION_NO_WORLD_WRITEBACK
    - SAC_DEPENDENCY_PLACEMENT
    - RETURN_PATH_CLOSED

lifecycle:
  activation_condition: AUTHORIZED_PAPER_REVIEW_TASK
  exit_condition: CANDIDATE_REPORT_RETURNED_TO_LIGHTER_FINAL_GATE
  reactivation_condition: NEW_SOURCE_OR_SUPPLEMENT_OR_Q0_CHANGE_OR_VALID_PROVIDER_REACTIVATION_REQUEST

evidence_state:
  E0_SOURCE_WRITTEN: true
  E1_IR_NORMALIZED: true
  E2_SEMANTIC_VALIDATED: true
  E3_CAPABILITY_RESOLVED: true
  E4_BOUND: true
  E5_GRAPH_AUDITED: true
  E6_RUNTIME_TESTED: false
  E7_HOST_ENFORCED: false
